[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-scholar"
version = "0.3.0"
description = "Evidence-grounded vision research agent with an independent, budgeted execution loop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18",
  "pypdf>=6,<7",
  "fonttools>=4,<5",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openharness-ai",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
benchmark = [
  "qdrant-client>=1.13,<2",
  "fastembed>=0.7,<1",
  "streamlit>=1.45,<2",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
]

[tool.uv.sources]
openharness-ai = { git = "https://github.com/HKUDS/OpenHarness.git", rev = "9b2efd795c6aa09f88b0c257d269a9e518da6ae7" }

[tool.hatch.build.targets.wheel]
packages = ["backend", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
