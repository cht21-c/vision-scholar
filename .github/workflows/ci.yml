name: Offline engineering checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m scripts.verify_study evidence/study
      - run: uv run --no-sync python -m scripts.reproduce_study --data-dir data/ci-study
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
